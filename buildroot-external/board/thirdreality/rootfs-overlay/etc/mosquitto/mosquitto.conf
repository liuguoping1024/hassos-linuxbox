# Place your local configuration in /etc/mosquitto/conf.d/
#
# A full description of the configuration file is at
# /usr/share/doc/mosquitto/examples/mosquitto.conf.example
per_listener_settings true

pid_file /run/mosquitto/mosquitto.pid

persistence true
persistence_location /var/lib/mosquitto/

log_dest file /var/log/mosquitto/mosquitto.log

include_dir /etc/mosquitto/conf.d

# Loopback only. Every consumer of this broker runs on the box and connects to
# mqtt://localhost:1883 - zigbee2mqtt, hubv3-bridge and the supervisor's own
# zigbee2mqtt config all do - so nothing needs it reachable off-box.
#
# Both loopback addresses are bound because /etc/hosts maps localhost to
# 127.0.0.1 and ::1, and Node's default verbatim resolution order can hand ::1
# to zigbee2mqtt first. Binding only 127.0.0.1 would break it on that path.
#
# per_listener_settings true makes the security options apply to the listener
# they follow, which is why they are repeated. The previous version had a
# single "listener 1883" with allow_anonymous *above* it, where it applied to
# the default listener that is never created rather than to port 1883.
listener 1883 127.0.0.1
allow_anonymous false
password_file /etc/mosquitto/passwd

listener 1883 ::1
allow_anonymous false
password_file /etc/mosquitto/passwd
