# LinuxBox HubV3L Supervisor Configuration File
# Default location: /var/lib/hubv3-supervisor/configuration.yaml
# This configuration is used by the C-based supervisor to manage system behavior

version: 1


# ============================================================================
# Hardware Configuration (GPIO Pins)
# ============================================================================
# If this section is not present, default values will be used
# Customize this for different board variants

hardware:
  # LED GPIO Configuration
  led:
    red:
      chip: "gpiochip0"
      line: 3
    green:
      chip: "gpiochip1"
      line: 4
    blue:
      chip: "gpiochip1"
      line: 5
  
  # Button GPIO Configuration
  # HubV3L: GPIOA_0 = line 26 = net BUTN_USR_A0, on the periphs bank.
  # uart_A's pinctrl is split (patch 1001) precisely to free this pin, so
  # unlike hubv3a's GPIOAO_11 the button is not on the AO bank here.
  button:
    chip: "gpiochip1"
    line: 26

  # Zigbee Module GPIO Configuration (BL702 reset/boot pins)
  # GPIOZ_1 = line 1 (reset), GPIOZ_3 = line 3 (boot/ISP)
  zigbee:
    chip: "gpiochip1"
    reset_line: 1
    boot_line: 3

  # Thread Module GPIO Configuration
  # GPIOA_1 = line 27 (reset), GPIOA_3 = line 29 (boot/ISP)
  thread:
    chip: "gpiochip1"
    reset_line: 27
    boot_line: 29


# ============================================================================
# System Information Configuration
# ============================================================================
system_info:
  # Timezone as a UTC offset "+HH:MM" / "-HH:MM" (default "+00:00" = UTC).
  # Supervisor-managed and decoupled from the OS timezone. Used e.g. to sync
  # time to a USB Clock accessory. Set via: POST /api/timezone  (offset=<minutes>)
  timezone: "+00:00"

  # Package-manager backend. Decides how component versions are read, whether
  # .deb OTA is offered, and whether component presence is verified on startup.
  #   auto - probe for dpkg: Armbian has it, Buildroot does not (recommended)
  #   dpkg - force the Debian backend
  #   none - force "no package manager"
  #
  # On Armbian components arrive incrementally as .deb packages, so one can
  # genuinely be missing. On Buildroot every component is baked into the image,
  # so there is nothing to verify and no per-package version to report.
  package_backend: "auto"

  # Units that satisfy the startup component check. The check passes when ANY
  # one of them is present, which covers the HA / matter2mqtt / openhab build
  # variants. Failing it shows the white 1Hz slow blink (SYS_SYSTEM_CORRUPTED).
  #
  # Skipped entirely when package_backend resolves to none.
  required_any_of:
    - "mosquitto.service"

  # Release information files
  release_files:
    t3r: "/etc/t3r-release"
    armbian: "/etc/armbian-release"
  
  # Device name prefixes based on board type
  # trhubv3 (exact match only) -> prefix_trhubv3
  # trhubv3a, trhubv3b, and all other board types -> default
  device_prefixes:
    trhubv3: "3RHUB-"
    default: "3RCARE-"
  

# ============================================================================
# Software Package Configuration
# ============================================================================
# Defines software packages to query and their version mapping keys

software_packages:
  # Home Assistant packages
  - package: "thirdreality-hacore-config"
    key: "config"
    
  - package: "thirdreality-python3"
    key: "python3"
    
  - package: "thirdreality-hacore"
    key: "hacore"
    required: true
    
  - package: "thirdreality-otbr-agent"
    key: "otbr-agent"
    
  - package: "thirdreality-zigbee-mqtt"
    key: "zigbee-mqtt"
    required: true
    
  - package: "thirdreality-music-assistant"
    key: "music-assistant"
    
  # OpenHAB packages
  - package: "thirdreality-openhab"
    key: "openhab"
    
  # System packages
  - package: "thirdreality-board-firmware"
    key: "board-firmware"
    
  - package: "thirdreality-zwave"
    key: "zwave"
    
  - package: "thirdreality-enocean"
    key: "enocean"
    
  - package: "thirdreality-bridge"
    key: "thirdreality-bridge"
    
  - package: "linuxbox-supervisor"
    key: "linuxbox-supervisor"
    
  - package: "linux-image-current-meson64"
    key: "linux-image"

# Software reporting groups (for system info display)
software_report_packages:
  homeassistant:
    - "thirdreality-hacore-config"
    - "thirdreality-python3"
    - "thirdreality-hacore"
    - "thirdreality-otbr-agent"
    - "thirdreality-zigbee-mqtt"
    - "thirdreality-music-assistant"
  openhab:
    - "thirdreality-openhab"

# Software configuration directories
# These directories contain software data and configuration files
software_config_directories:
  - source: "/var/lib/thread"
    mapped_name: "thread_data"
    
  - source: "/var/lib/homeassistant"
    mapped_name: "homeassistant_data"
    
  - source: "/opt/zigbee2mqtt/data"
    mapped_name: "zigbee2mqtt_data"
    
  - source: "/etc/mosquitto"
    mapped_name: "mosquitto_config"


# Services to manage during backup/restore
# These services will be stopped before backup/restore and restarted after
managed_services:
  - "home-assistant.service"
  - "matter-server.service"
  - "otbr-agent.service"
  - "zigbee2mqtt.service"
  - "mosquitto.service"

# ============================================================================
# Backup and Restore Configuration
# ============================================================================
backup_restore:
  # Storage mode: 'internal' or 'external'
  storage_mode: "external"
  path: "/mnt/R3Backup"
  #storage_mode: "internal"
  # path: "/lib/thirdreality/backup"

  # Restore record directory
  restore_record_dir: "/usr/lib/thirdreality/conf"
  
  # Maximum number of backups to keep (0 = unlimited)
  max_backups: 5
  
  # Exclude patterns for backup (fnmatch style)
  # These files/directories will be skipped during backup
  exclude_patterns:
    # Log files
    - "*.log"
    - "*.log.*"
    
    # Temporary files
    - "*.tmp"
    - "*.cache"
    
    # Cache directories
    - "cache/"
    - "logs/"
    - "log/"
    - "temp/"
    - "tmp/"
    
    # Python cache
    - "__pycache__/"
    - "*.pyc"
    
    # Process files
    - "*.pid"
    - "*.sock"
    
    # Database temporary files
    - "*.db-wal"
    - "*.db-shm"
    
    # Backup files
    - "*.backup"
    - "*.bak"
  
  # Database cleanup settings
  database_cleanup:
    # Database path in backup (relative to mapped_name)
    homeassistant_db_path: "homeassistant_data/homeassistant/home-assistant_v2.db"

    # Home Assistant database cleanup threshold (bytes)
    homeassistant_db_threshold: 104857600  # 100MB

    # Tables to purge during cleanup
    purge_tables:
      - "events"
      - "states"
      - "statistics"
      - "statistics_short_term"

# ============================================================================
# BLE Provisioning Configuration
# ============================================================================
ble:
  # 配网超时时间（秒）
  # 客户端断连后会重新计时
  provisioning_timeout: 300
  
  # BlueZ adapter 名称
  adapter: "hci0"

# ============================================================================
# Zigbee2MQTT Configuration(zigbee mode switch)
# ============================================================================
zigbee2mqtt:
  data_path: "/opt/zigbee2mqtt/data"
  config_file: "configuration.yaml"
  default_template: "/lib/thirdreality/conf/configuration_blz.yaml.default"